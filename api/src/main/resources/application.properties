spring.application.name=aqua-grow-api

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/aquagrow
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Liquibase Configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# Keycloak / OAuth2 Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://sso.aqua-grow.cloud/realms/aquagrow
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://sso.aqua-grow.cloud/realms/aquagrow/protocol/openid-connect/certs
