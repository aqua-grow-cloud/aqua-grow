spring.application.name=aqua-grow-api
server.port=${SERVER_PORT:8080}

# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aquagrow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Configuration
spring.datasource.hikari.pool-name=AquaGrowHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Liquibase Configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# Keycloak / OAuth2 Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:https://sso.aqua-grow.cloud/realms/aquagrow}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:https://sso.aqua-grow.cloud/realms/aquagrow/protocol/openid-connect/certs}

# CORS Configuration
# Use "*" for development/testing (localhost, Postman)
# Use specific origins for production (e.g., "https://app.aqua-grow.cloud")
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Actuator & Health Probes
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Logging Configuration
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.aquagrow.api=${LOGGING_LEVEL_COM_AQUAGROW_API:DEBUG}
logging.level.com.aquagrow.api.config.RequestLoggingFilter=${LOGGING_LEVEL_REQUEST_FILTER:INFO}
logging.level.org.springframework.web=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB:INFO}
logging.level.org.hibernate.SQL=${LOGGING_LEVEL_ORG_HIBERNATE_SQL:DEBUG}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOGGING_LEVEL_ORG_HIBERNATE_SQL_BINDER:TRACE}
# Core CORS processing
logging.level.org.springframework.web.cors=DEBUG

# Spring Security filter chain (VERY important)
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG

# Authorization decisions (optional but useful)
logging.level.org.springframework.security.web.access.intercept=DEBUG

# OAuth2 / JWT (if using Keycloak or resource server)
logging.level.org.springframework.security.oauth2=DEBUG

# Pagination Configuration
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=10000

# Telegram Bot configuration

# Ollama AI Configuration (legacy RestTemplate-based)
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3}
ollama.connect-timeout=${OLLAMA_CONNECT_TIMEOUT:30000}
ollama.read-timeout=${OLLAMA_READ_TIMEOUT:120000}

# Spring AI - Ollama (used by MCP chat with tool calling)
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:llama3}
spring.ai.ollama.chat.options.temperature=0.3

# Spring AI - MCP Client (connects to aqua-grow-mcp MCP server)
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.initialized=false
spring.ai.mcp.client.sse.connections.aqua-grow-mcp.url=${MCP_SERVER_URL:http://localhost:8090}

# Log Residency Configuration
# Standard Spring Boot logging properties that Log4j2 picks up
logging.file.path=${LOG_PATH:logs}
logging.file.name=${LOG_FILE_NAME:aqua-grow-api}

# Custom Logging Pattern (Local)
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}
