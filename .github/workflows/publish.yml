# On every push to main: run CI, build and push the images of what changed, scan them, then open the cloudpe bump PR.
name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read   # required by the reusable ci.yml (its paths-filter job)

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  prepare:
    needs: ci
    runs-on: ${{ vars.SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","aqua-grow-mac"]') || 'ubuntu-latest' }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'api/**'
              - 'build-logic/**'
              - 'gradle/**'
              - '*.gradle'
              - 'gradle.properties'
              - 'docker/**'
            mcp:
              - 'mcp/**'
              - 'build-logic/**'
              - 'gradle/**'
              - '*.gradle'
              - 'gradle.properties'
              - 'docker/**'
            resource-monitor:
              - 'resource-monitor/**'
              - 'build-logic/**'
              - 'gradle/**'
              - '*.gradle'
              - 'gradle.properties'
              - 'docker/**'
            frontend:
              - 'frontend/**'

  images:
    needs: prepare
    if: needs.prepare.outputs.services != '[]'
    runs-on: ${{ vars.SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","aqua-grow-mac"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.prepare.outputs.services) }}
    env:
      IMAGE: ghcr.io/aqua-grow-cloud/aqua-grow-${{ matrix.service }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the jar
        if: matrix.service != 'frontend'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - if: matrix.service != 'frontend'
        uses: gradle/actions/setup-gradle@v4
      - if: matrix.service != 'frontend'
        run: ./gradlew :${{ matrix.service }}:bootJar --console=plain

      - name: Push JVM image
        if: matrix.service != 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}/build/libs
          file: docker/jvm.Dockerfile
          build-args: PORT=${{ matrix.service == 'api' && '8080' || matrix.service == 'mcp' && '8090' || '8091' }}
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Push frontend image
        if: matrix.service == 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  bump:
    needs: [prepare, images]
    uses: ./.github/workflows/bump-config.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      services: ${{ needs.prepare.outputs.services }}
      source_sha: ${{ github.sha }}
    secrets:
      CONFIG_REPO_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}

  release:
    needs: [prepare, bump]
    runs-on: ${{ vars.SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","aqua-grow-mac"]') || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: GitHub Release with changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          scripts/changelog.sh > CHANGELOG.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file CHANGELOG.md
