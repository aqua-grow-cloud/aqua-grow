# Opens a PR on aqua-grow-config that points the cloudpe manifests at new image tags.
# Merging that PR is the deploy: ArgoCD syncs the config repo.
name: Bump config

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      services:
        description: 'JSON array, e.g. ["api","mcp"]'
        required: true
        type: string
      source_sha:
        required: true
        type: string
    secrets:
      CONFIG_APP_PRIVATE_KEY:
        required: true
      CONFIG_APP_ID:
        required: false   # may be a repository variable instead

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Short-lived token for the GitHub App, limited to aqua-grow-config
      - id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CONFIG_APP_ID || secrets.CONFIG_APP_ID }}
          private-key: ${{ secrets.CONFIG_APP_PRIVATE_KEY }}
          owner: aqua-grow-cloud
          repositories: aqua-grow-config
      - uses: actions/checkout@v4
        with:
          repository: aqua-grow-cloud/aqua-grow-config
          token: ${{ steps.app.outputs.token }}
          path: config
      - name: Update image tags and validate overlays
        env:
          TAG: ${{ inputs.tag }}
          SERVICES: ${{ inputs.services }}
        run: |
          if ! [[ "$TAG" =~ ^[0-9A-Za-z._-]+$ ]]; then echo "bad tag" >&2; exit 1; fi
          mapfile -t services < <(echo "$SERVICES" | jq -r '.[]')
          scripts/bump-config.sh config "$TAG" "${services[@]}"
      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          path: config
          token: ${{ steps.app.outputs.token }}
          branch: bump/cloudpe-${{ inputs.tag }}
          base: main
          commit-message: 'Deploy ${{ inputs.tag }} to cloudpe'
          title: 'Deploy ${{ inputs.tag }} to cloudpe'
          body: |
            Image tag `${{ inputs.tag }}` for: `${{ inputs.services }}`.

            Source: https://github.com/${{ github.repository }}/commit/${{ inputs.source_sha }}

            Merging this PR deploys to cloudpe (ArgoCD syncs `main`).
