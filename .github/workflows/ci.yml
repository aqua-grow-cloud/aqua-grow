name: CI

on:
  pull_request:
  workflow_call:   # also run by publish.yml on pushes to main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ${{ vars.SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","aqua-grow-mac"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read   # paths-filter lists PR files through the API
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'api/**'
              - 'mcp/**'
              - 'resource-monitor/**'
              - 'build-logic/**'
              - 'gradle/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle.properties'
              - 'docker/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ${{ vars.SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","aqua-grow-mac"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test (api, mcp, resource-monitor)
        run: ./gradlew build --console=plain
      # Known drift: the API renamed operations (logSample -> createSampleLog, ...) and added ~45 endpoints after
      # frontend/openapi.json was last exported. Advisory until the frontend is moved to the new names, then
      # delete `continue-on-error` so drift fails the build.
      - name: OpenAPI contract matches the frontend client input
        continue-on-error: true
        run: scripts/check-openapi.sh
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: '**/build/reports/tests'
          retention-days: 7

  docker-backend:
    needs: backend
    runs-on: ${{ vars.SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","aqua-grow-mac"]') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: api, port: 8080 }
          - { service: mcp, port: 8090 }
          - { service: resource-monitor, port: 8091 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :${{ matrix.service }}:bootJar --console=plain
      - name: Build image (not pushed)
        run: >
          docker build -f docker/jvm.Dockerfile
          --build-arg PORT=${{ matrix.port }}
          -t aqua-grow-${{ matrix.service }}:ci
          ${{ matrix.service }}/build/libs

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ${{ vars.SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","aqua-grow-mac"]') || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run api:generate
      - name: Dependency audit (production, high+)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - run: npm test -- --run
      - run: npm run build
      - name: Build image (not pushed)
        working-directory: .
        run: docker build -t aqua-grow-frontend:ci frontend

  # Single required check for branch protection: green when every job that ran passed or was skipped.
  ci:
    if: always()
    needs: [changes, backend, docker-backend, frontend]
    runs-on: ${{ vars.SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","aqua-grow-mac"]') || 'ubuntu-latest' }}
    steps:
      - name: Evaluate results
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
