worker_processes 4;

events { worker_connections 1024; }

http {
    # API upstream (for optional API proxying)
    upstream api_backend {
        server aqua-grow-api:8080;
    }

    # Keycloak upstream (for optional SSO proxying)
    upstream keycloak_backend {
        server aqua-grow-keycloak:8080;
    }

    server {
        listen 80;
        root  /usr/share/nginx/html;
        include /etc/nginx/mime.types;

        # Frontend SPA routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Optional: Proxy API requests (if frontend uses relative URLs)
        # Uncomment if VITE_API_URL is set to '/api'
        # location /api/ {
        #     proxy_pass http://api_backend/api/;
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection 'upgrade';
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_cache_bypass $http_upgrade;
        # }

        # Optional: Proxy Keycloak requests (if VITE_KEYCLOAK_URL is set to '/auth')
        # Uncomment if you want single-domain setup
        # location /auth/ {
        #     proxy_pass http://keycloak_backend/;
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection 'upgrade';
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_cache_bypass $http_upgrade;
        # }

        # Gzip compression for better performance
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;
        gzip_disable "MSIE [1-6]\.";
    }
}
